<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - SkillHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="container-xl py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-6">
        <div class="card card-custom p-4 p-md-5 border-0 shadow-lg bg-white" style="border-radius: 20px;">
          
          <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
              <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Create Student Profile</h3>
            <p class="text-muted small">Join your campus peer-to-peer skill exchange community</p>
          </div>

          <form id="register-form">
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                <input type="text" class="form-control border-start-0" id="name" placeholder="e.g. Sathya M." required autofocus>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control border-start-0" id="email" placeholder="student@university.edu" required>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-sm-7">
                <label for="department" class="form-label">Department / Major</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-building text-muted"></i></span>
                  <select class="form-select border-start-0" id="department" required>
                    <option value="" disabled selected>Select Department</option>
                    <option value="CSE">Computer Science &amp; Eng (CSE)</option>
                    <option value="IT">Information Technology (IT)</option>
                    <option value="ECE">Electronics &amp; Comm (ECE)</option>
                    <option value="EEE">Electrical &amp; Electronics (EEE)</option>
                    <option value="Mechanical">Mechanical Engineering</option>
                    <option value="Civil">Civil Engineering</option>
                    <option value="Data Science">Data Science &amp; AI</option>
                    <option value="Business">Business &amp; Management</option>
                  </select>
                </div>
              </div>

              <div class="col-sm-5">
                <label for="year" class="form-label">Year of Study</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-calendar3 text-muted"></i></span>
                  <select class="form-select border-start-0" id="year" required>
                    <option value="" disabled selected>Select Year</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                    <option value="5">5th Year (Postgrad)</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-sm-6">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" class="form-control border-start-0" id="password" placeholder="••••••••" required minlength="4">
                </div>
              </div>

              <div class="col-sm-6">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-check2-circle text-muted"></i></span>
                  <input type="password" class="form-control border-start-0" id="confirmPassword" placeholder="••••••••" required minlength="4">
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2.5 mb-3 fw-bold" id="submit-btn">
              <span class="spinner-border spinner-border-sm me-2 d-none" id="loading-spinner"></span>
              Create Account &amp; Start Exchanging
            </button>
          </form>

          <div class="text-center mt-3 pt-3 border-top">
            <p class="small text-muted mb-0">
              Already have an account? <a href="login.html" class="fw-bold text-primary text-decoration-none">Sign In here</a>
            </p>
          </div>

        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const form = document.getElementById('register-form');
    const submitBtn = document.getElementById('submit-btn');
    const spinner = document.getElementById('loading-spinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showToast('Passwords do not match! Please check.', 'danger');
        return;
      }

      const payload = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        department: document.getElementById('department').value,
        year: parseInt(document.getElementById('year').value, 10),
        password: password
      };

      submitBtn.disabled = true;
      spinner.classList.remove('d-none');

      try {
        const savedStudent = await api.students.register(payload);
        if (savedStudent && savedStudent.studentId) {
          // Auto-login the registered student
          savedStudent.password = password;
          setCurrentUser(savedStudent);
          showToast(`Welcome to SkillHub, ${savedStudent.name}! Account created.`, 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 600);
        } else {
          showToast('Account registered! Please log in.', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 600);
        }
      } catch (err) {
        showToast('Registration failed: ' + (err.message || 'Please check if email is already taken or backend is running'), 'danger');
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
